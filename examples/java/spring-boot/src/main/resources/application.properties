# Scenarios S1 and S8: Spring Boot with the pool HikariCP. Key transfer method D.

spring.datasource.url=jdbc:firebird://${FBCRYPT_HOST}:${FBCRYPT_PORT}/crypt_red
spring.datasource.username=${FBCRYPT_USER}
spring.datasource.password=${FBCRYPT_PASSWORD}

# The key is NOT in this file. Spring takes the value from the environment variable
# FBCRYPT_DB_KEY. In production use a secret store (Vault, Kubernetes secrets,
# Docker secrets) that fills the same property.
# Format of the value: <name>:0x..,0x..,
spring.datasource.hikari.data-source-properties.dbCryptConfig=${FBCRYPT_DB_KEY}

# The key is sent as a static value. Never allow a connection without wire encryption.
spring.datasource.hikari.data-source-properties.wireCrypt=REQUIRED

spring.datasource.hikari.maximum-pool-size=4

# A console program with a fixed output
spring.main.web-application-type=none
spring.main.banner-mode=off
logging.level.root=OFF
