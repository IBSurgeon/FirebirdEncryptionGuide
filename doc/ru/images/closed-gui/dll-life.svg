<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400">
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#52606d"/></marker></defs>
<rect x="0" y="0" width="960" height="400" fill="#ffffff"/>
<text x="20" y="30" font-family="Noto Serif, Segoe UI, Arial, sans-serif" font-size="14" text-anchor="start" fill="#1f2933" font-weight="bold">Без закрепления: плагин загружает и выгружает библиотеку при каждом подключении</text>
<text x="170" y="62" font-family="Noto Serif, Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1f2933" font-style="italic">подключение 1</text>
<rect x="20" y="72" width="92" height="44" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/>
<text x="66.0" y="98.2" font-family="Noto Serif, Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2933">LoadLibrary</text>
<rect x="118" y="72" width="108" height="44" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.2"/>
<text x="172.0" y="98.2" font-family="Noto Serif, Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2933">MakeKeys()</text>
<rect x="232" y="72" width="90" height="44" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
<text x="277.0" y="98.2" font-family="Noto Serif, Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2933">FreeLibrary</text>
<text x="484" y="62" font-family="Noto Serif, Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1f2933" font-style="italic">подключение 2</text>
