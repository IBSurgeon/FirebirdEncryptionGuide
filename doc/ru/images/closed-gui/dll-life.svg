<text x="380.0" y="98.2" font-family="Noto Serif, Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2933">LoadLibrary</text>
<rect x="432" y="72" width="108" height="44" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.2"/>
<text x="486.0" y="98.2" font-family="Noto Serif, Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2933">MakeKeys()</text>
<rect x="546" y="72" width="90" height="44" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
<text x="591.0" y="98.2" font-family="Noto Serif, Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2933">FreeLibrary</text>
